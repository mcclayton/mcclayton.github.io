version: 2.1
jobs:
  test:
    docker:
      - image: cimg/node:24.20
    environment:
      - NODE_ENV: development
    working_directory: ~/mcclayton.github.io
    steps:
      - checkout
      - restore_cache:
          key: website-npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: website-npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run tests
          command: npm test -- --run
      - run:
          name: Build production site
          command: npm run build
workflows:
  build_and_test:
    jobs:
      - test
